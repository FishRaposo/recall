name: Bug report
description: Something in the game behaves incorrectly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. Please include the seed shown on the title or debug overlay when possible, and say whether it was touch, mouse or gamepad.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: seed
    attributes:
      label: Seed
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Firefox 157 on Windows 11
    validations:
      required: true
