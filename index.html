<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recall</title>
  <meta name="description" content="A small arcade game about one blade that always comes back. Throw it, call it home, catch it to build your multiplier.">
  <style>
    html, body { margin: 0; height: 100%; background: #cfc4ad; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
    noscript { position: fixed; inset: 0; display: grid; place-items: center; font: 16px Georgia, serif; color: #1d1b1a; }
  </style>
</head>
<body>
  <canvas id="game" tabindex="0" aria-label="Recall: game canvas. Click to begin."></canvas>
  <noscript>Recall needs JavaScript to run.</noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
